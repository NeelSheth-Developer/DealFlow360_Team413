<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DealFlow360 — API Tester</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel-2: #1e222d; --line: #2a2f3d;
    --ink: #e6e8ee; --muted: #8b93a7; --accent: #6366f1; --accent-dim: #4f46e5;
    --ok: #34d399; --warn: #fbbf24; --err: #f87171; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 700; letter-spacing: .5px; color: var(--accent); font-size: 13px; }
  header input {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    padding: 6px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px; min-width: 280px;
  }
  .chip {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); font-family: var(--mono);
  }
  .chip.on { color: var(--ok); border-color: var(--ok); }
  main { display: grid; grid-template-columns: 300px 1fr 1fr; gap: 0; height: calc(100vh - 53px); }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } }

  nav { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  nav .group { padding: 10px 14px 4px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .6px; color: var(--muted); }
  nav button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    color: var(--ink); padding: 6px 14px; cursor: pointer; font-size: 12.5px;
    border-left: 2px solid transparent;
  }
  nav button:hover { background: var(--panel-2); }
  nav button.active { background: var(--panel-2); border-left-color: var(--accent); }
  nav .m { font-family: var(--mono); font-size: 10px; margin-right: 6px; opacity: .75; }
  .GET { color: #60a5fa; } .POST { color: var(--ok); } .PUT { color: var(--warn); }
  .PATCH { color: #c084fc; } .DELETE { color: var(--err); }

  section { padding: 16px 20px; overflow-y: auto; }
  section + section { border-left: 1px solid var(--line); }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .path { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
  .desc { color: var(--muted); font-size: 12.5px; margin: 10px 0 14px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); margin: 14px 0 5px; }
  textarea, select, .field {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 9px 11px; font-family: var(--mono); font-size: 12px;
  }
  textarea { min-height: 150px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row .field { flex: 1; }
  button.go {
    background: var(--accent); border: 0; color: #fff; padding: 9px 18px;
    border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; margin-top: 14px;
  }
  button.go:hover { background: var(--accent-dim); }
  button.ghost {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 11px;
  }
  button.ghost:hover { color: var(--ink); }
  pre {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px; font-family: var(--mono); font-size: 11.5px; overflow-x: auto;
    white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  .status { font-family: var(--mono); font-size: 12px; margin: 10px 0; }
  .s2 { color: var(--ok); } .s4 { color: var(--warn); } .s5 { color: var(--err); }
  .vars { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px;
    font-family: var(--mono); font-size: 11px; margin-top: 8px; }
  .vars b { color: var(--muted); font-weight: 400; }
  .vars span { color: var(--ok); word-break: break-all; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .hint { color: var(--warn); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <span class="brand">DEALFLOW360</span>
  <input id="base" value="/api/v1" title="API base path" />
  <span class="chip" id="staffChip">staff: —</span>
  <span class="chip" id="custChip">customer: —</span>
  <button class="ghost" id="reset">reset vars</button>
  <span class="chip" id="health">checking…</span>
</header>

<main>
  <nav id="nav"></nav>

  <section>
    <h2 id="title">Pick an endpoint</h2>
    <div class="path" id="path"></div>
    <div class="desc" id="desc">
      Start with <strong>Auth → Login (admin)</strong>, or run
      <strong>Signup (staff)</strong> then <strong>Verify OTP</strong> — with
      <code>EXPOSE_DEV_OTP=true</code> the code is captured for you.
    </div>

    <div id="editor" hidden>
      <label>Auth</label>
      <select id="auth">
        <option value="staff">staff token</option>
        <option value="customer">customer token</option>
        <option value="none">none</option>
      </select>

      <div id="pathVarsWrap" hidden>
        <label>Path variables</label>
        <div id="pathVars"></div>
      </div>

      <div id="queryWrap" hidden>
        <label>Query string</label>
        <input class="field" id="query" placeholder="pageSize=25&amp;tier=gold" />
      </div>

      <div id="bodyWrap" hidden>
        <label>Body (JSON)</label>
        <textarea id="body" spellcheck="false"></textarea>
      </div>

      <button class="go" id="send">Send request</button>
    </div>
  </section>

  <section>
    <label>Response</label>
    <div class="status" id="status">—</div>
    <pre id="out">Nothing sent yet.</pre>

    <details open>
      <summary>Captured variables</summary>
      <div class="vars" id="varsView"></div>
    </details>
  </section>
</main>

<script src="./app.js"></script>
</body>
</html>
